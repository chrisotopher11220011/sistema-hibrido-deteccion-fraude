# Prototipo academico de deteccion hibrida de fraude. docs/spec.md, seccion 8.1.
# Todo tiene valores por defecto: no hace falta un archivo .env.
# Los puertos se publican solo en 127.0.0.1: nada queda visible en la red.
name: fraude

services:
  api:
    build: .
    image: fraude-local:0.7.0
    user: "${FRAUDE_UID:-1000}:${FRAUDE_GID:-1000}"
    environment:
      # Que modelo usa la API: auto (el real si existe; si no, el de la muestra), real o
      # muestra. Lo recarga sola cuando `entrenar` deja uno nuevo (ADR 0013).
      FRAUDE_MODELO: "${FRAUDE_MODELO:-auto}"
      # La pagina habla con n8n a traves de la API, por la red interna (ADR 0007 y 0015).
      FRAUDE_URL_N8N: http://n8n:5678
      # LLM local (ADR 0016): `activo` solo con ./fraude todo --llm. Sin el, POST
      # /explicacion responde que se use la plantilla y no llama a nadie.
      FRAUDE_LLM: "${FRAUDE_LLM:-desactivado}"
    ports:
      - "127.0.0.1:${FRAUDE_PUERTO_API:-8000}:8000"
    volumes:
      - ./config:/trabajo/config:ro
      - ./datos:/trabajo/datos
      - ./resultados:/trabajo/resultados
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  n8n:
    # Version exacta, verificada el 2026-11-16 (docs/decisions/0004). No usar `stable` ni `latest`.
    image: n8nio/n8n:2.47.7
    init: true
    # Importa y publica los flujos antes de arrancar (n8n/arranque.sh).
    entrypoint: ["/bin/sh", "/arranque/arranque.sh"]
    environment:
      TZ: UTC
      GENERIC_TIMEZONE: UTC
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: "http://localhost:${FRAUDE_PUERTO_N8N:-5678}/"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:${FRAUDE_PUERTO_N8N:-5678}:5678"
    volumes:
      - n8n_datos:/home/node/.n8n
      - ./n8n/arranque.sh:/arranque/arranque.sh:ro
      - ./n8n/flujos:/arranque/flujos:ro
    healthcheck:
      # Sano solo cuando el flujo ping esta importado, publicado y responde.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/webhook/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 180s

  tareas:
    image: fraude-local:0.7.0
    pull_policy: never
    profiles: ["tareas"]
    user: "${FRAUDE_UID:-1000}:${FRAUDE_GID:-1000}"
    entrypoint: ["fraude"]
    environment:
      FRAUDE_URL_API: http://api:8000
      FRAUDE_URL_N8N: http://n8n:5678
      FRAUDE_COMMIT: "${FRAUDE_COMMIT:-sin-commit}"
      FRAUDE_ETIQUETA: "${FRAUDE_ETIQUETA:-sin-etiqueta}"
      N8N_VERSION_FIJADA: "2.47.7"
    volumes:
      - ./config:/trabajo/config:ro
      - ./datos:/trabajo/datos
      - ./resultados:/trabajo/resultados
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_healthy

  llm:
    # Servidor de modelos local, opcional (docs/spec.md, seccion 14; ADR 0016). Solo arranca
    # con el perfil `llm` (./fraude todo --llm). Version exacta verificada el 2026-11-17; no
    # usar `latest`. Sin puerto publicado: solo la API habla con el, por la red interna. La
    # grafica se reserva en compose.gpu.yaml, que ./fraude anade si Docker esta preparado.
    image: ollama/ollama:0.40.16
    profiles: ["llm"]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # El modelo queda cargado mientras el servicio este en marcha: la primera explicacion
      # no paga la carga.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      # Los modelos descargados (unos 3,3 GB) se guardan aqui y sobreviven a ./fraude apagar.
      - ollama_modelos:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  n8n_datos:
  ollama_modelos:
