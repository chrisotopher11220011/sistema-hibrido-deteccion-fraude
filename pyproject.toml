[project]
name = "fraude"
version = "0.5.0"
description = "Prototipo academico: deteccion hibrida de fraude con reglas, aprendizaje automatico y n8n"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "numpy>=2",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "shap==0.54.1",
    "uvicorn>=0.30",
]

[project.scripts]
fraude = "fraude.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraude"]

[tool.pytest.ini_options]
testpaths = ["tests/unitarias", "tests/contrato", "tests/n8n"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
