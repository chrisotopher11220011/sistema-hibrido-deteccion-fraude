name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas unitarias y estilo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        run: pipx install uv==0.11.32
      - name: Instalar dependencias bloqueadas
        run: uv sync --frozen
      - name: Estilo (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Guiones de shell (shellcheck)
        run: shellcheck fraude n8n/arranque.sh
      - name: Pruebas unitarias, de contrato y de flujos (simulador con Node.js)
        env:
          FRAUDE_EXIGIR_NODE: "1"
        run: |
          node --version
          uv run pytest -v

  punta-a-punta:
    name: Compose, n8n, flujos y pagina
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Variables de la ejecucion
        run: |
          {
            echo "FRAUDE_UID=$(id -u)"
            echo "FRAUDE_GID=$(id -g)"
            echo "FRAUDE_COMMIT=${GITHUB_SHA::7}"
            echo "FRAUDE_ETIQUETA=ci"
          } >> "$GITHUB_ENV"
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

      - name: Construir y arrancar con Compose
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: La API responde desde el anfitrion
        run: curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:8000/salud | tee salud.json && grep -q '"estado":"ok"' salud.json

      - name: n8n responde al ping desde el anfitrion
        run: curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:5678/webhook/ping | tee ping.json && grep -q '"estado"' ping.json && grep -q 'ok' ping.json

      - name: Version de n8n en marcha
        run: |
          version="$(docker compose exec -T n8n n8n --version | tail -n 1)"
          echo "n8n $version"
          grep -q "n8nio/n8n:${version}\$" <(grep 'image: n8nio' compose.yaml)

      - name: Los puertos solo escuchan en 127.0.0.1
        run: |
          docker ps --format '{{.Names}} {{.Ports}}'
          if docker ps --format '{{.Ports}}' | grep -E '0\.0\.0\.0|\[::\]'; then
            echo "Hay puertos publicados fuera de 127.0.0.1"; exit 1
          fi

      # Fase 5: flujos de n8n reales antes de entrenar. Sin modelo, una transaccion con
      # variables es una evaluacion fallida (503) y queda en error_evaluacion; tambien la
      # entrada invalida y la revision humana (200, 409, 404 y 422).
      - name: Flujos de n8n sin modelo (rama de error y revision)
        run: python3 tests/punta_a_punta/comprobar_flujos.py --sin-modelo

      # En la CI se usa la muestra para pruebas: la descarga del conjunto real es N3.
      # `todo` incluye `demostrar`: lote por n8n y por Python, con paridad total exigida.
      - name: tareas todo --muestra (Compose directo)
        run: docker compose run --rm -T tareas todo --muestra

      - name: Evidencia del camino directo
        run: python3 tests/punta_a_punta/comprobar_evidencia.py

      # Fase 4: la API cargo sola el modelo que entreno `todo`, evalua con el contrato 8.3,
      # responde errores con cuerpo y registra y revisa casos.
      - name: API en marcha (modelo, /evaluar, errores y casos)
        run: python3 tests/punta_a_punta/comprobar_api.py http://127.0.0.1:8000

      # Fase 6: la pagina en un navegador real (Chromium con Playwright): teclado, etiqueta
      # despues del veredicto y nunca enviada, estados de error, axe-core (WCAG 2.2 A y AA) y
      # capturas en tres anchos por dos temas, mas el modo presentacion.
      - name: Playwright y axe-core para la pagina
        run: |
          python3 -m venv /tmp/pw
          /tmp/pw/bin/pip install --quiet playwright==1.63.0
          /tmp/pw/bin/playwright install --with-deps chromium
          mkdir -p /tmp/axe && cd /tmp/axe && npm pack --silent axe-core@4.14.1 && tar xzf axe-core-4.14.1.tgz

      - name: Pagina de simulacion (teclado, accesibilidad y capturas)
        run: /tmp/pw/bin/python tests/punta_a_punta/comprobar_pagina.py http://127.0.0.1:8000 --axe /tmp/axe/package/axe.min.js --salida capturas_ci

      - name: Subir las capturas de la pagina
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-pagina
          path: capturas_ci/
          if-no-files-found: warn
          retention-days: 14

      - name: La evidencia exporta casos, revisiones y la sesion de la pagina
        run: |
          docker compose run --rm -T tareas evidencia
          python3 tests/punta_a_punta/comprobar_evidencia.py --con-casos --con-simulacion

      - name: Con la API detenida, n8n responde 502 con el caso en error_evaluacion
        run: |
          docker compose stop api
          python3 tests/punta_a_punta/comprobar_flujos.py --api-detenida

      - name: Apagar
        run: docker compose down

      - name: ./fraude todo --muestra (segundo arranque, con el volumen de n8n ya creado)
        run: ./fraude todo --muestra

      - name: ./fraude estado
        run: ./fraude estado | tee estado.txt && grep -q 'api responde' estado.txt && grep -q 'n8n responde' estado.txt

      - name: Evidencia del guion
        run: python3 tests/punta_a_punta/comprobar_evidencia.py --con-anfitrion

      - name: sudo ./fraude evidencia no deja archivos de root
        run: |
          sudo ./fraude evidencia
          python3 tests/punta_a_punta/comprobar_evidencia.py --con-anfitrion

      - name: sudo ./fraude todo desde cero tampoco deja archivos de root
        run: |
          ./fraude apagar
          rm -rf resultados/en_curso resultados/2*
          sudo ./fraude todo --muestra
          python3 tests/punta_a_punta/comprobar_evidencia.py --con-anfitrion

      - name: ./fraude apagar
        run: |
          ./fraude apagar
          test -z "$(docker compose ps -q)"

      - name: Registros si algo fallo
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail 300 || true

      - name: Subir la evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-ci
          path: resultados/
          if-no-files-found: warn
          retention-days: 14
